spring.application.name=stickershop


logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.root=${LOG_LEVEL}
logging.file.name=${LOG_FILE_NAME}
logging.pattern.file={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","logger":"%c","message":"%m"}


spring.datasource.url=jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_URL}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL}


management.endpoint.health.show-details=always
management.endpoints.web.base-path=/stickershop/actuator
management.endpoints.web.exposure.include=*
#management.endpoints.web.exposure.exclude=health,beans
management.endpoint.configprops.show-values=always
management.endpoint.env.show-values=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Backend project for stickershop E-commerce application
info.app.version=1.0.0
info.app.contact.email=niroshab14@gmail.com



spring.security.user.name=${STICKERSHOP_USERNAME}
spring.security.user.password=${STICKERSHOP_PASSWORD}
spring.security.user.roles=${STICKERSHOP_ROLES}

# Stripe Configuration
stripe.apiKey=${STRIPE_API_KEY}
